description: |
  [**Tenet**](https://github.com/keithadler/tenet) is an independent implementation of the Lean 4
  kernel in C# on .NET, written from the type theory and the reference kernel's behavior rather than
  translated from it. It shares no code with Lean, which is the point of it: a defect in the C++
  kernel's *code* is one Tenet would not reproduce. A defect in its *design* is one it likely would,
  since matching the reference kernel's decisions was the goal.

  It reads lean4export NDJSON and also reads Lean's compiled `.olean` files directly, with no Lean
  toolchain installed.

  Everywhere Tenet deliberately decides something differently from Lean is written down in
  `docs/divergences.md`. Two are relevant here: it checks that the constant named `Nat.add` behaves
  like addition before taking the arithmetic shortcut named after it, and it refuses a numeric
  literal unless the environment's `Nat` is the inductive the literal denotes. Both are extra checks
  on the prelude of the kind the arena's README permits.
url: https://github.com/keithadler/tenet
ref: main
rev: REPLACE_WITH_REV
version: "0.11.1"

# Tenet checks declarations on several threads, so it has to say how many or the runner will
# oversubscribe the machine and spoil everyone else's timings. Four, not twelve: measured on all of
# Init, wall time goes 30.1s at one worker to 13.3s at four and only 11.0s at twelve, while summed
# kernel time across workers rises from 26s to 65s. Past four it buys almost nothing and burns CPU
# that other checkers are entitled to.
threads: 4
# The SDK comes from the arena's own flake, alongside elan and the rest.
# --self-contained so the produced binary carries its runtime and does not depend on the shell it is
# run from; it costs nothing at run time and one less assumption.
build: dotnet publish src/Tenet.Cli -c Release -f net10.0 -p:TargetFrameworks=net10.0 --self-contained true -r linux-x64 -o arena-bin
run: |
  # 0 accept, 1 reject, 2 decline. Tenet agrees on the first two and uses 4 for declining, which is
  # what it does when a file asks it to trust the output of compiled code: not a claim the proof is
  # invalid, a refusal to vouch for it. Anything else means the checker could not process the file,
  # which is an error and is left to surface as one rather than being hidden as a decline.
  # `|| c=$?` rather than a bare call: the arena runs this through /bin/sh without -e, so a bare call
  # would be fine, but this is correct under either and the difference is invisible until it is not.
  # DOTNET_GCHeapCount=4 for the same reason as --jobs 4, and it has to be said separately because the
  # .NET GC sizes itself from the machine's core count, not from what this checker was budgeted. Left
  # unset on a twelve-core box the runtime builds twelve heaps and each keeps its own gen0 headroom,
  # which is memory this checker declared it would not take. Measured on the `Lean` export, 164,133
  # declarations: peak resident 3.5 GB unset against 2.1 GB at four, for the same instructions
  # (128.5s CPU against 125.9s). Wall time is about 9% worse because collection stops overlapping as
  # well, and that is the right trade on a board that scores instructions and memory.
  c=0
  DOTNET_GCHeapCount=4 ./arena-bin/tenet check "$IN" --quiet --jobs 4 || c=$?
  case $c in
    0|1) exit $c ;;
    4)   exit 2 ;;
    *)   exit 9 ;;
  esac
