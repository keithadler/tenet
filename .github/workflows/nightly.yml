name: Nightly

# The .olean reader depends on Lean's compiled object layout, which is not a stable interface,
# and Mathlib moves daily. CI on every push only checks Init, so a change that breaks reading
# real projects would not show up there. This finds it before a user does.
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

jobs:
  mathlib:
    name: Check Mathlib master
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build -c Release

      - name: Install elan
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Make room
        run: |
          # Mathlib's cache is several gigabytes and a hosted runner starts with little free disk.
          # Nothing under /usr/share/dotnet: the build needs it, and deleting its Roslyn broke this job once.
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/swift /opt/hostedtoolcache/CodeQL || true
          df -h / | tail -1

      - name: Build Mathlib from its own cache
        run: |
          git clone --depth 1 https://github.com/leanprover-community/mathlib4 "$RUNNER_TEMP/mathlib4"
          cd "$RUNNER_TEMP/mathlib4"
          lake exe cache get
          lake build Mathlib.Init          # enough to populate the tree; the cache supplies the rest
          echo "MATHLIB=$RUNNER_TEMP/mathlib4" >> "$GITHUB_ENV"

      - name: Check it
        run: |
          # tee below would otherwise return tee's status and hide a failing check, which is how a red
          # run gets reported green.
          set -o pipefail
          # --low-memory switches to the workstation collector, which uses roughly a third of the
          # memory and takes longer. The server collector peaks near 9 GB on Mathlib, which is
          # more headroom than a hosted runner reliably has.
          # --rules on the largest corpus there is. A rule that 765,000 declarations never reach is a rule
          # this run says nothing about, and that list is only interesting if something computes it nightly.
          dotnet run --no-build -c Release -f net10.0 --project src/Tenet.Cli -- \
            check "$MATHLIB/.lake/build/lib/lean/Mathlib.olean" --all --quiet --low-memory --rules \
            --report "$RUNNER_TEMP/mathlib.json" | tee "$RUNNER_TEMP/rules.txt"

      - name: Report
        if: always()
        run: |
          r="$RUNNER_TEMP/mathlib.json"
          if [ -f "$r" ]; then
            python3 - "$r" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          print(f"## Mathlib master: {'clean' if d.get('success') else 'FAILURES'}")
          print()
          print(f"- {d.get('checked')} declarations, {d.get('seconds')} s, Lean {d.get('lean','?')}")
          for f in d.get("failures", [])[:20]:
              print(f"- FAIL `{f['name']}`: {f['message'].splitlines()[0][:200]}")
          PY
          fi
          if [ -f "$RUNNER_TEMP/rules.txt" ]; then
            {
              echo
              echo "### Rule coverage"
              echo
              echo '```'
              sed -n '/^kernel rules:/,$p' "$RUNNER_TEMP/rules.txt" | grep -vE '^ +[0-9]+ +[A-Za-z]' | head -20
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mathlib-report
          path: ${{ runner.temp }}/mathlib.json
          if-no-files-found: ignore

  proved-checker:
    name: Everything Tenet accepts, put to a checker with a consistency proof
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build -c Release
      - name: Install elan
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Make room
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/swift /opt/hostedtoolcache/CodeQL || true
          df -h / | tail -1

      - name: Build Mathlib from its own cache
        run: |
          git clone --depth 1 https://github.com/leanprover-community/mathlib4 "$RUNNER_TEMP/mathlib4"
          cd "$RUNNER_TEMP/mathlib4"
          lake exe cache get
          lake build Mathlib.Init

      - name: Build the exporter and con-leche on their own toolchains
        run: |
          git clone --depth 1 https://github.com/leanprover/lean4export "$RUNNER_TEMP/lean4export"
          # The exporter has to run on Mathlib's toolchain, not its own.
          cp "$RUNNER_TEMP/mathlib4/lean-toolchain" "$RUNNER_TEMP/lean4export/lean-toolchain"
          (cd "$RUNNER_TEMP/lean4export" && lake build)
          git clone --depth 1 https://github.com/leanprover/con-leche "$RUNNER_TEMP/con-leche"
          (cd "$RUNNER_TEMP/con-leche" && lake build con-leche)

      - name: Export a Mathlib slice and put it to both
        run: |
          MOD=Mathlib.Analysis.SpecialFunctions.Trigonometric.Basic
          cd "$RUNNER_TEMP/mathlib4"
          lake env "$RUNNER_TEMP/lean4export/.lake/build/bin/lean4export" "$MOD" > "$RUNNER_TEMP/slice.ndjson"
          cd "$GITHUB_WORKSPACE"
          wc -l < "$RUNNER_TEMP/slice.ndjson"

          # con-leche carries a Lean proof that it never accepts a file declaring a theorem of type False. Both
          # accepting the same file in full is what transfers that to everything Tenet accepted in it.
          src/Tenet.Cli/bin/Release/net10.0/tenet check "$RUNNER_TEMP/slice.ndjson" --quiet | tee "$RUNNER_TEMP/t.txt"
          "$RUNNER_TEMP/con-leche/.lake/build/bin/con-leche" --jobs=4 "$RUNNER_TEMP/slice.ndjson" | tee "$RUNNER_TEMP/c.txt"

          {
            echo "## A proved checker agrees"
            echo
            echo "- tenet: $(grep -E '^(OK|FAILED)' "$RUNNER_TEMP/t.txt" | tail -1)"
            echo "- con-leche: $(tail -1 "$RUNNER_TEMP/c.txt")"
          } >> "$GITHUB_STEP_SUMMARY"

  three-way:
    name: Tenet vs Lean's kernel vs con-leche
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build -c Release

      - name: Install elan
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # Three Lean projects pinning three different toolchains; elan picks each one per directory.
      - name: Build the exporter and both oracles
        run: |
          git clone --depth 1 https://github.com/leanprover/lean4export
          (cd lean4export && lake build)
          (cd tools/leancheck && lake build)
          git clone --depth 1 https://github.com/leanprover/con-leche
          (cd con-leche && lake build con-leche)

      - name: Export Init.Prelude and Init.Core
        run: |
          mkdir -p exports
          cd lean4export
          lake env .lake/build/bin/lean4export Init.Prelude > ../exports/Init.Prelude.ndjson
          lake env .lake/build/bin/lean4export Init.Core > ../exports/Init.Core.ndjson

      - name: Differential test with con-leche as a third opinion
        run: |
          # leancheck finds the Lean sysroot through the `lean` proxy, which needs a default toolchain
          # when run outside a Lean project directory.
          elan default "$(cat tools/leancheck/lean-toolchain)"
          for target in Init.Prelude Init.Core; do
            echo "::group::$target"
            tools/Tenet.DiffTest/bin/Release/net10.0/Tenet.DiffTest \
              --export "exports/$target.ndjson" \
              --tenet src/Tenet.Cli/bin/Release/net10.0/tenet \
              --oracle tools/leancheck/.lake/build/bin/leancheck \
              --oracle2 con-leche/.lake/build/bin/con-leche \
              --variants 20 --mutations 12 --seed $(( ${{ github.run_number }} * 7 + 1 )) \
              | tee "$RUNNER_TEMP/$target.log"
            echo "::endgroup::"
          done

      - name: Summary
        if: always()
        run: |
          for target in Init.Prelude Init.Core; do
            f="$RUNNER_TEMP/$target.log"
            [ -f "$f" ] || continue
            echo "## $target" >> "$GITHUB_STEP_SUMMARY"
            grep -E "^done:|^third opinion:|^con-leche " "$f" | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"
          done
