name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  # Trusted Publishing: the job asks GitHub for a short-lived OIDC token, nuget.org validates it against a
  # policy naming this owner, this repository and this workflow file, and hands back an API key good for an
  # hour. Nothing long-lived is stored anywhere, so there is no key to leak or rotate.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # At job level on purpose. A step's own `env` is not dependable in that step's own `if`, so a publish
      # guarded by a variable set on the same step could skip itself and leave a green release that
      # published nothing. This is the nuget.org profile name, not a credential.
      NUGET_USER: ${{ secrets.NUGET_USER }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build -c Release
      - run: dotnet test --no-build -c Release
      - run: dotnet pack --no-build -c Release -o artifacts
      - name: Build standalone binaries
        # A native binary needs no .NET installed and starts in about 7 ms instead of 27.
        # That is the difference between "install an SDK first" and "download and run".
        run: |
          for rid in linux-x64 osx-arm64 win-x64; do
            # -f is required now that the project multi-targets; the standalone binary is the newer runtime.
            dotnet publish src/Tenet.Cli -c Release -f net10.0 -r "$rid" -p:PublishAot=true \
              -o "artifacts/$rid" 2>/dev/null || {
                echo "AOT unavailable for $rid on this runner; falling back to self-contained"
                dotnet publish src/Tenet.Cli -c Release -f net10.0 -r "$rid" --self-contained true \
                  -p:PublishSingleFile=true -o "artifacts/$rid"
              }
            ( cd "artifacts/$rid" && tar czf "../tenet-${GITHUB_REF_NAME}-$rid.tar.gz" tenet* 2>/dev/null || true )
          done
          ls -la artifacts/*.tar.gz || true

      - name: Attach packages to the GitHub release
        # The release is normally created by hand with written notes before the tag is pushed;
        # if it does not exist yet, create it from the tag so the packages still land somewhere.
        run: |
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "Tenet ${GITHUB_REF_NAME#v}" --generate-notes
          gh release upload "$GITHUB_REF_NAME" artifacts/*.nupkg --clobber
          gh release upload "$GITHUB_REF_NAME" artifacts/*.tar.gz --clobber || true
        env:
          GH_TOKEN: ${{ github.token }}
      # Late on purpose: the key nuget.org returns lasts an hour, and the AOT builds above are the slow part.
      - name: Exchange an OIDC token for a short-lived nuget.org key
        if: ${{ env.NUGET_USER != '' }}
        id: nuget_login
        uses: NuGet/login@v1
        with:
          user: ${{ env.NUGET_USER }}

      - name: Publish to nuget.org
        # Pushing a .nupkg also pushes the .snupkg beside it, so the symbol server gets the sources a
        # consumer would step into.
        if: ${{ env.NUGET_USER != '' }}
        run: |
          dotnet nuget push "artifacts/*.nupkg" \
            --api-key "${{ steps.nuget_login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
          echo "published to nuget.org: $(ls artifacts/*.nupkg | wc -l) package(s)" >> "$GITHUB_STEP_SUMMARY"

      - name: Say so when nothing was published
        # A release that quietly skipped publishing looks exactly like one that published, which is the
        # failure this line exists to make impossible.
        if: ${{ env.NUGET_USER == '' }}
        run: |
          echo "NUGET_USER is not set, so nothing was pushed to nuget.org." >> "$GITHUB_STEP_SUMMARY"
          echo "Trusted Publishing needs that secret (the nuget.org profile name) and a policy on" >> "$GITHUB_STEP_SUMMARY"
          echo "nuget.org naming this owner, repository and workflow file." >> "$GITHUB_STEP_SUMMARY"
          echo "The packages are attached to the GitHub release instead." >> "$GITHUB_STEP_SUMMARY"
