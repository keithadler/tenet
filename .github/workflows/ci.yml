name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release --logger "trx;LogFileName=results.trx"
      - run: dotnet run --no-build -c Release -f net10.0 --project src/Tenet.Cli -- check tests/fixtures/Nat.add_succ.ndjson
      # The package ships tools/net8.0, so the older target gets run, not just compiled.
      - run: dotnet run --no-build -c Release -f net8.0 --project src/Tenet.Cli -- check tests/fixtures/Nat.add_succ.ndjson

      # The corpus that must be rejected, run through the CLI rather than the test harness, so the claim holds
      # for the binary people install. Driven by the manifest: only the cases that name a defense are expected
      # to be accepted when it is off. The rest are rejected by core typing rules, where there is nothing
      # optional to switch off, and demanding they flip would be demanding the kernel be unsound on request.
      - name: The negative corpus is rejected, and each case lands when its own defense is off
        shell: bash
        run: |
          fail=0
          while IFS=$'\t' read -r file defense; do
            if dotnet run --no-build -c Release -f net10.0 --project src/Tenet.Cli -- \
                 check "tests/fixtures/invalid/$file" --quiet >/dev/null 2>&1; then
              echo "::error::$file was ACCEPTED; every file in the negative corpus must be rejected"
              fail=1
            else
              echo "rejected (as required): $file"
            fi
            if [ -n "$defense" ]; then
              if env "$defense=1" dotnet run --no-build -c Release -f net10.0 --project src/Tenet.Cli -- \
                   check "tests/fixtures/invalid/$file" --quiet >/dev/null 2>&1; then
                echo "  accepted with $defense set, so it is demonstrating that defense"
              else
                echo "::error::$file is still rejected with $defense set, so it is not demonstrating that defense"
                fail=1
              fi
            fi
          # tr -d '\r' is load-bearing on Windows: python writes CRLF there, so a case with no defense
          # would arrive as a lone carriage return, which is not empty, and every case would take the
          # defense branch with a variable name ending in CR. That is what this step failed on first.
          done < <(python3 -c "
          import json
          for c in json.load(open('tests/fixtures/invalid/manifest.json'))['cases']:
              print(c['file'], c.get('defenseOff') or '', sep='\t')
          " | tr -d '\r')
          exit $fail

  arena:
    name: The arena's own tests, scored the arena's way
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # The exact build line from packaging/arena/tenet.yaml. The arena supplies the SDK from its own flake,
      # at the maintainer's request, so there is no nix here either: what is being tested is that this
      # command produces a binary that scores what the submission says it scores.
      - name: Build the way the arena would
        run: |
          dotnet publish src/Tenet.Cli -c Release -f net10.0 -p:TargetFrameworks=net10.0 \
            --self-contained true -r linux-x64 -o arena-bin

      - name: The run line and this job have not drifted apart
        run: |
          run_line=$(sed -n '/^run: |/,$p' packaging/arena/tenet.yaml | grep -v '^ *#')
          fail=0
          for needle in '--jobs 4' 'DOTNET_GCHeapCount=4'; do
            case $run_line in
              *"$needle"*) ;;
              *) echo "::error::packaging/arena/tenet.yaml no longer passes $needle, but this job still does"; fail=1 ;;
            esac
          done
          exit $fail

      - name: Score the arena's published test suite
        run: |
          curl -sSfL -o tests.tar.gz https://arena.lean-lang.org/lean-arena-tests.tar.gz
          mkdir -p arena-tests && tar xzf tests.tar.gz -C arena-tests

          # The mapping in packaging/arena/tenet.yaml, verbatim: 0 accept, 1 reject, 4 decline -> 2.
          # `env -i` is deliberate. The arena runs the checker with whatever environment it has, and running
          # with none at all proves the binary needs nothing installed.
          # `|| c=$?` rather than a bare call: this step runs under `bash -e`, where a non-zero return ends
          # the script before the next line can read $?.
          # `--jobs 4` and `DOTNET_GCHeapCount=4` are both from the run line and both have to be here, or
          # this job scores a configuration the arena will never run. The step below fails if either one
          # stops appearing in tenet.yaml.
          check() {
            local c=0
            env -i DOTNET_GCHeapCount=4 "$PWD/arena-bin/tenet" check "$1" --quiet --jobs 4 >/dev/null 2>&1 || c=$?
            case $c in
              0|1) return $c ;;
              4)   return 2 ;;
              *)   echo "::error::$1 gave exit $c, which is neither accept, reject nor decline"; return 9 ;;
            esac
          }

          bad_ok=0; bad_bad=0
          for f in $(find arena-tests/bad -type f | sort); do
            c=0; check "$f" || c=$?
            # A decline is not a rejection: the arena scores it as ignored, so it is not a pass here.
            if [ "$c" = 1 ]; then bad_ok=$((bad_ok+1)); else bad_bad=$((bad_bad+1)); echo "::error::must reject but came back $c: ${f#arena-tests/}"; fi
          done

          good_ok=0; good_bad=0
          for f in $(find arena-tests/good -type f | sort); do
            c=0; check "$f" || c=$?
            if [ "$c" = 0 ]; then good_ok=$((good_ok+1)); else good_bad=$((good_bad+1)); echo "::error::must accept but came back $c: ${f#arena-tests/}"; fi
          done

          {
            echo "## Lean Kernel Arena, published test suite"
            echo
            echo "| | result |"
            echo "| --- | --- |"
            echo "| \`bad/\`, must reject | **$bad_ok / $((bad_ok+bad_bad))** |"
            echo "| \`good/\`, must accept | **$good_ok / $((good_ok+good_bad))** |"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "bad/  $bad_ok rejected, $bad_bad missed"
          echo "good/ $good_ok accepted, $good_bad missed"
          # A perfect score is the claim being made in packaging/arena/README.md, so anything less is red.
          [ "$bad_bad" = 0 ] && [ "$good_bad" = 0 ]

      - name: And this repo's own negative corpus, through the same binary
        run: |
          fail=0
          for f in tests/fixtures/invalid/*.ndjson; do
            c=0
            env -i "$PWD/arena-bin/tenet" check "$f" --quiet >/dev/null 2>&1 || c=$?
            case $c in
              1) echo "rejected: $f" ;;
              4) echo "declined: $f" ;;
              *) echo "::error::$f came back $c; every file in the negative corpus must be rejected or declined"; fail=1 ;;
            esac
          done
          exit $fail

  check-prelude:
    # Re-check the Lean prelude from a fresh export on every push to main.
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Install elan
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build lean4export
        run: |
          git clone --depth 1 https://github.com/leanprover/lean4export
          cd lean4export && lake build
      - name: Export Init.Prelude and Init.Core
        run: |
          mkdir -p exports
          cd lean4export
          lake env .lake/build/bin/lean4export Init.Prelude > ../exports/Init.Prelude.ndjson
          lake env .lake/build/bin/lean4export Init.Core > ../exports/Init.Core.ndjson
      - run: dotnet build -c Release
      - run: dotnet run --no-build -c Release -f net10.0 --project src/Tenet.Cli -- check exports/Init.Prelude.ndjson
      - run: dotnet run --no-build -c Release -f net10.0 --project src/Tenet.Cli -- check exports/Init.Core.ndjson
      - name: Check all of Init in place from the toolchain's .olean files
        run: |
          cd tools/leancheck
          LIB="$(lake env printenv LEAN_SYSROOT)/lib/lean"
          cd ../..
          dotnet run --no-build -c Release -f net10.0 --project src/Tenet.Cli -- check "$LIB/Init.olean" --all --quiet
      - name: Resolve a declaration by name alone, across the whole toolchain
        run: |
          cd tools/leancheck
          LIB="$(lake env printenv LEAN_SYSROOT)/lib/lean"
          cd ../..
          # A directory target searches every module under it, so this must find Nat.add_comm without
          # being told that it lives in Init.olean.
          out=$(dotnet run --no-build -c Release -f net10.0 --project src/Tenet.Cli -- axioms "$LIB" Nat.add_comm)
          echo "$out"
          case "$out" in
            *"not in"*) echo "directory target failed to resolve Nat.add_comm"; exit 1 ;;
          esac
          # And the other direction: find the name without knowing it, by pattern.
          dotnet run --no-build -c Release -f net10.0 --project src/Tenet.Cli -- names "$LIB" --all add_comm \
            | grep -qx "Nat.add_comm"

      - name: Does `tenet axioms` still agree with `#print axioms`?
        run: |
          # The C# tests say what the axiom walk should answer. This says Lean agrees, which is the only
          # reason those expectations are worth anything: they were transcribed from a run of this script,
          # and a transcription nothing re-checks is a claim about Lean that quietly stops being true.
          # It also asserts the one place the two disagree, leanprover/lean4#15226, so a fix upstream
          # surfaces here rather than going unnoticed.
          dotnet publish src/Tenet.Cli -c Release -f net10.0 -o axiom-bin
          ./tests/fixtures/axioms/compare.sh "$PWD/axiom-bin/tenet"

      - name: Does crosscheck notice a damaged declaration?
        run: |
          # lean4export's sysroot, not leancheck's: the two pin different Lean versions, and crosschecking an
          # export against another version's .olean reports version differences as reader defects. The harness
          # refuses to run on a baseline that is not already clean, which is how this was caught.
          cd lean4export
          LIB="$(lake env printenv LEAN_SYSROOT)/lib/lean"
          cd ..
          dotnet build -c Release tools/Tenet.DiffTest
          # Crosscheck carries the whole claim that the .olean reader is faithful, because comparing verdicts
          # cannot catch a reader bug. Until this ran, it had only ever been given undamaged input, where it
          # says "no differences" whether or not it is able to see one.
          tools/readercheck/readercheck.sh exports/Init.Prelude.ndjson "$LIB/Init/Prelude.olean"

      - name: Build the Lean kernel oracle
        run: |
          cd tools/leancheck && lake build
          # leancheck locates the Lean sysroot through the `lean` proxy, which needs a default toolchain
          # when run outside a Lean project directory.
          elan default "$(cat lean-toolchain)"
      - name: Differential test against Lean's kernel (mutated prelude)
        run: |
          tools/Tenet.DiffTest/bin/Release/net10.0/Tenet.DiffTest \
            --export exports/Init.Prelude.ndjson \
            --tenet src/Tenet.Cli/bin/Release/net10.0/tenet \
            --oracle tools/leancheck/.lake/build/bin/leancheck \
            --variants 15 --mutations 10 --seed ${{ github.run_number }}

  dotnet-next:
    # .NET 10 is what ships. This tracks the next runtime so a change in its defaults is found here
    # rather than by a user: the .NET 11 RC turned on the GC's adaptive sizing, which costs this
    # workload about 30%, and added analyzer rules that failed the build with no code change.
    name: Build and test on the next .NET
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            11.0.x
          dotnet-quality: preview
      - name: Target the next framework
        run: |
          sed -i 's|<TargetFramework>net10.0</TargetFramework>|<TargetFramework>net11.0</TargetFramework>|' Directory.Build.props
          python3 -c "import json; d=json.load(open('global.json')); d['sdk']['rollForward']='latestMajor'; json.dump(d, open('global.json','w'), indent=2)"
      - run: dotnet build -c Release
      - run: dotnet test --no-build -c Release

  olean-compat:
    # The .olean reader and the kernel against several Lean toolchains, not only the one the tests pin.
    # Each job installs a toolchain and checks its whole Init library in place.
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        toolchain: [v4.35.0-rc1, v4.34.0, v4.33.1, v4.28.0, v4.24.0, v4.16.0, v4.12.0]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Install elan
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Install Lean ${{ matrix.toolchain }}
        run: elan toolchain install "leanprover/lean4:${{ matrix.toolchain }}"
      - run: dotnet build -c Release
      - name: Check all of Init from ${{ matrix.toolchain }}
        run: |
          LIB="$HOME/.elan/toolchains/leanprover--lean4---${{ matrix.toolchain }}/lib/lean"
          dotnet run --no-build -c Release -f net10.0 --project src/Tenet.Cli -- info "$LIB/Init.olean"
          dotnet run --no-build -c Release -f net10.0 --project src/Tenet.Cli -- check "$LIB/Init.olean" --all --quiet

  sample:
    name: The sample builds against the published packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      # Deliberately not a project reference and not in Tenet.slnx: this restores Tenet.Kernel and
      # Tenet.Olean from nuget.org, so a green run here means what was published is still usable as a
      # library by someone who has never seen this repository.
      - name: Build it and check the binary runs
        run: |
          cd samples/Tenet.Explorer
          dotnet build -c Release
          # No Lean toolchain on this runner, so the assertion is that the tool starts and reports
          # usage rather than that it checks anything. The value is above: restore and compile prove
          # the published packages resolve and their API is what the sample expects.
          # Both targets, because lib/net8.0 reaches a consumer only through a package and this is
          # the only place that path is walked.
          for tfm in net8.0 net10.0; do
            echo "--- $tfm"
            set +e
            out=$(./bin/Release/$tfm/tenet-explorer 2>&1); code=$?
            set -e
            echo "$out"
            [ "$code" = "2" ] || { echo "$tfm: expected exit 2 for no arguments, got $code"; exit 1; }
            echo "$out" | grep -q "usage: tenet-explorer" || { echo "$tfm: no usage line"; exit 1; }
          done

  action:
    # The GitHub Action (action.yml) end to end: build a small Lake project, then check it with the released tenet.
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build a Lake project (the kernel oracle)
        run: cd tools/leancheck && lake build
      - uses: ./
        with:
          project: tools/leancheck
