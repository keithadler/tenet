name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release --logger "trx;LogFileName=results.trx"
      - run: dotnet run --no-build -c Release -f net10.0 --project src/Tenet.Cli -- check tests/fixtures/Nat.add_succ.ndjson
      # The package ships tools/net8.0, so the older target gets run, not just compiled.
      - run: dotnet run --no-build -c Release -f net8.0 --project src/Tenet.Cli -- check tests/fixtures/Nat.add_succ.ndjson

  check-prelude:
    # Re-check the Lean prelude from a fresh export on every push to main.
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Install elan
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build lean4export
        run: |
          git clone --depth 1 https://github.com/leanprover/lean4export
          cd lean4export && lake build
      - name: Export Init.Prelude and Init.Core
        run: |
          mkdir -p exports
          cd lean4export
          lake env .lake/build/bin/lean4export Init.Prelude > ../exports/Init.Prelude.ndjson
          lake env .lake/build/bin/lean4export Init.Core > ../exports/Init.Core.ndjson
      - run: dotnet build -c Release
      - run: dotnet run --no-build -c Release -f net10.0 --project src/Tenet.Cli -- check exports/Init.Prelude.ndjson
      - run: dotnet run --no-build -c Release -f net10.0 --project src/Tenet.Cli -- check exports/Init.Core.ndjson
      - name: Check all of Init in place from the toolchain's .olean files
        run: |
          cd tools/leancheck
          LIB="$(lake env printenv LEAN_SYSROOT)/lib/lean"
          cd ../..
          dotnet run --no-build -c Release -f net10.0 --project src/Tenet.Cli -- check "$LIB/Init.olean" --all --quiet
      - name: Resolve a declaration by name alone, across the whole toolchain
        run: |
          cd tools/leancheck
          LIB="$(lake env printenv LEAN_SYSROOT)/lib/lean"
          cd ../..
          # A directory target searches every module under it, so this must find Nat.add_comm without
          # being told that it lives in Init.olean.
          out=$(dotnet run --no-build -c Release -f net10.0 --project src/Tenet.Cli -- axioms "$LIB" Nat.add_comm)
          echo "$out"
          case "$out" in
            *"not in"*) echo "directory target failed to resolve Nat.add_comm"; exit 1 ;;
          esac
          # And the other direction: find the name without knowing it, by pattern.
          dotnet run --no-build -c Release -f net10.0 --project src/Tenet.Cli -- names "$LIB" --all add_comm \
            | grep -qx "Nat.add_comm"

      - name: Does crosscheck notice a damaged declaration?
        run: |
          # lean4export's sysroot, not leancheck's: the two pin different Lean versions, and crosschecking an
          # export against another version's .olean reports version differences as reader defects. The harness
          # refuses to run on a baseline that is not already clean, which is how this was caught.
          cd lean4export
          LIB="$(lake env printenv LEAN_SYSROOT)/lib/lean"
          cd ..
          dotnet build -c Release tools/Tenet.DiffTest
          # Crosscheck carries the whole claim that the .olean reader is faithful, because comparing verdicts
          # cannot catch a reader bug. Until this ran, it had only ever been given undamaged input, where it
          # says "no differences" whether or not it is able to see one.
          tools/readercheck/readercheck.sh exports/Init.Prelude.ndjson "$LIB/Init/Prelude.olean"

      - name: Build the Lean kernel oracle
        run: |
          cd tools/leancheck && lake build
          # leancheck locates the Lean sysroot through the `lean` proxy, which needs a default toolchain
          # when run outside a Lean project directory.
          elan default "$(cat lean-toolchain)"
      - name: Differential test against Lean's kernel (mutated prelude)
        run: |
          tools/Tenet.DiffTest/bin/Release/net10.0/Tenet.DiffTest \
            --export exports/Init.Prelude.ndjson \
            --tenet src/Tenet.Cli/bin/Release/net10.0/tenet \
            --oracle tools/leancheck/.lake/build/bin/leancheck \
            --variants 15 --mutations 10 --seed ${{ github.run_number }}

  dotnet-next:
    # .NET 10 is what ships. This tracks the next runtime so a change in its defaults is found here
    # rather than by a user: the .NET 11 RC turned on the GC's adaptive sizing, which costs this
    # workload about 30%, and added analyzer rules that failed the build with no code change.
    name: Build and test on the next .NET
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            11.0.x
          dotnet-quality: preview
      - name: Target the next framework
        run: |
          sed -i 's|<TargetFramework>net10.0</TargetFramework>|<TargetFramework>net11.0</TargetFramework>|' Directory.Build.props
          python3 -c "import json; d=json.load(open('global.json')); d['sdk']['rollForward']='latestMajor'; json.dump(d, open('global.json','w'), indent=2)"
      - run: dotnet build -c Release
      - run: dotnet test --no-build -c Release

  olean-compat:
    # The .olean reader and the kernel against several Lean toolchains, not only the one the tests pin.
    # Each job installs a toolchain and checks its whole Init library in place.
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        toolchain: [v4.35.0-rc1, v4.34.0, v4.33.1, v4.28.0, v4.24.0, v4.16.0, v4.12.0]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Install elan
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Install Lean ${{ matrix.toolchain }}
        run: elan toolchain install "leanprover/lean4:${{ matrix.toolchain }}"
      - run: dotnet build -c Release
      - name: Check all of Init from ${{ matrix.toolchain }}
        run: |
          LIB="$HOME/.elan/toolchains/leanprover--lean4---${{ matrix.toolchain }}/lib/lean"
          dotnet run --no-build -c Release -f net10.0 --project src/Tenet.Cli -- info "$LIB/Init.olean"
          dotnet run --no-build -c Release -f net10.0 --project src/Tenet.Cli -- check "$LIB/Init.olean" --all --quiet

  sample:
    name: The sample builds against the published packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      # Deliberately not a project reference and not in Tenet.slnx: this restores Tenet.Kernel and
      # Tenet.Olean from nuget.org, so a green run here means what was published is still usable as a
      # library by someone who has never seen this repository.
      - name: Build it and check the binary runs
        run: |
          cd samples/Tenet.Explorer
          dotnet build -c Release
          # No Lean toolchain on this runner, so the assertion is that the tool starts and reports
          # usage rather than that it checks anything. The value is above: restore and compile prove
          # the published packages resolve and their API is what the sample expects.
          # Both targets, because lib/net8.0 reaches a consumer only through a package and this is
          # the only place that path is walked.
          for tfm in net8.0 net10.0; do
            echo "--- $tfm"
            set +e
            out=$(./bin/Release/$tfm/tenet-explorer 2>&1); code=$?
            set -e
            echo "$out"
            [ "$code" = "2" ] || { echo "$tfm: expected exit 2 for no arguments, got $code"; exit 1; }
            echo "$out" | grep -q "usage: tenet-explorer" || { echo "$tfm: no usage line"; exit 1; }
          done

  action:
    # The GitHub Action (action.yml) end to end: build a small Lake project, then check it with the released tenet.
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build a Lake project (the kernel oracle)
        run: cd tools/leancheck && lake build
      - uses: ./
        with:
          project: tools/leancheck
